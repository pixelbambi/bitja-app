<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bitja — spletni AR filter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stage">
  <video id="camera" autoplay playsinline muted></video>

  <!-- creature canvases + hidden source videos are injected here by script.js -->
  <div id="creature-layer"></div>

  <div id="permission-msg" hidden>
    <p>Za AR filter potrebujem dostop do kamere. Preveri dovoljenja brskalnika in osveži stran.</p>
    <button id="retry-btn">Poskusi znova</button>
  </div>

  <div id="caption"></div>

  <div id="controls">
    <button id="save-btn" title="Deli / shrani sliko">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </button>
  </div>
</div>

<canvas id="capture-canvas" hidden></canvas>

<script src="script.js"></script>
</body>
</html>
